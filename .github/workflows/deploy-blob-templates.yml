# .github/workflows/deploy-blob-templates.yml
# ─────────────────────────────────────────────────────────────────────────────
# Blob Template Deployment Pipeline
#
# Triggered by: any push to main that touches blob_templates/**
#
# Steps:
#   1. Upload all files in blob_templates/ to the blob-templates Blob container.
#      Existing blobs are overwritten; new blobs are created.
#      No ACA restart needed — templates are downloaded per-request by the
#      engagement worker, not cached at container startup.
#
# Auth: OIDC federated identity — no long-lived secrets.
#   Required GitHub secrets (shared with other deploy workflows):
#     AZURE_TENANT_ID        — Azure AD tenant ID
#     AZURE_SUBSCRIPTION_ID  — Subscription ID
#     AZURE_CLIENT_ID        — GHA OIDC app registration client ID
#
# Required Azure role assignments on the GHA principal (managed in Terraform):
#   Storage Blob Data Contributor — scope: stterianservices storage account
#
# Path convention in blob-templates container:
#   award_nomination_onboarding.pptx  — Award Nomination onboarding template
#   <service>_onboarding.pptx         — future service templates follow same pattern
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Blob Templates

on:
  push:
    branches:
      - main
      - terianix-platform
    paths:
      - "blob_templates/**"
      - ".github/workflows/deploy-blob-templates.yml"
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC token issuance
  contents: read

jobs:
  deploy-templates:
    name: Upload templates → Blob
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'terianix-platform' && 'terianix-platform-prod' || 'prod' }}
    env:
      STORAGE_ACCOUNT: ${{ vars.TERIAN_STORAGE_ACCOUNT || 'stterianservices' }}
      BLOB_CONTAINER: blob-templates

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Terianix target configuration
        if: github.ref_name == 'terianix-platform'
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TARGET_STORAGE: ${{ vars.TERIAN_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          [[ -n "$CLIENT_ID" && -n "$TARGET_STORAGE" ]]
          [[ "$TENANT_ID" == "5979eb86-9af1-4c74-8e50-acbe7d6a5cf9" ]]
          [[ "$SUBSCRIPTION_ID" == "2bb69129-5e74-44d9-af68-96d45633f667" ]]

      # ── Azure login (OIDC — no stored credentials) ──────────────────────────
      - name: Azure Login
        uses: azure/login@v2
        with:
          tenant-id:       ${{ github.ref_name == 'terianix-platform' && vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ github.ref_name == 'terianix-platform' && vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          client-id:       ${{ github.ref_name == 'terianix-platform' && vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}

      # ── Upload all template files to Blob Storage ────────────────────────────
      # upload-batch syncs blob_templates/ → blob-templates container.
      # Blob paths mirror the local filenames directly (no subdirectory prefix).
      # --overwrite true replaces existing blobs; new blobs are created as-is.
      - name: Upload templates to Blob Storage
        run: |
          az storage blob upload-batch \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --auth-mode    login \
            --destination  ${{ env.BLOB_CONTAINER }} \
            --source       blob_templates \
            --overwrite    true

      - name: Summary
        run: |
          echo "### Blob Templates Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Container: \`${{ env.BLOB_CONTAINER }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Files uploaded:" >> $GITHUB_STEP_SUMMARY
          for f in blob_templates/*; do
            echo "- \`$(basename $f)\`" >> $GITHUB_STEP_SUMMARY
          done
