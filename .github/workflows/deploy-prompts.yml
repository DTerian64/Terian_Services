# .github/workflows/deploy-prompts.yml
# ─────────────────────────────────────────────────────────────────────────────
# Prompt Update Pipeline
#
# Triggered by: any push to main that touches ai_prompts/**
#
# Steps:
#   1. Upload changed prompt files to Azure Blob Storage (ai-prompts container)
#   2. Trigger a rolling restart of the Container App so every replica
#      picks up the new prompts on its next startup.
#
# Auth: OIDC federated identity — no long-lived secrets.
#   Required GitHub secrets:
#     AZURE_TENANT_ID        — Azure AD tenant ID
#     AZURE_SUBSCRIPTION_ID  — Subscription ID
#     AZURE_CLIENT_ID        — GHA OIDC app registration client ID
#                              (same principal used for ACR + ACA deployments)
#
# Required Azure role assignments on the GHA principal (managed in Terraform):
#   Storage Blob Data Contributor — scope: stterianservices storage account
#   Container Apps Contributor    — scope: terian-services-backend (existing)
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy AI Prompts

on:
  push:
    branches:
      - main
      - terianix-platform
    paths:
      - "ai_prompts/**"
      - ".github/workflows/deploy-prompts.yml"
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC token issuance
  contents: read

concurrency:
  group: terian-backend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-prompts:
    name: Upload prompts → Blob, restart ACA
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'terianix-platform' && 'terianix-platform-prod' || 'prod' }}
    env:
      STORAGE_ACCOUNT: ${{ vars.TERIAN_STORAGE_ACCOUNT || 'stterianservices' }}
      BLOB_CONTAINER: ai-prompts
      ACA_NAME: ${{ vars.TERIAN_BACKEND_APP }}
      ACA_RESOURCE_GROUP: ${{ vars.TERIAN_BACKEND_RG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Terianix target configuration
        if: github.ref_name == 'terianix-platform'
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TARGET_STORAGE: ${{ vars.TERIAN_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          [[ -n "$CLIENT_ID" && -n "$TARGET_STORAGE" && -n "$ACA_NAME" ]]
          [[ "$TENANT_ID" == "5979eb86-9af1-4c74-8e50-acbe7d6a5cf9" ]]
          [[ "$SUBSCRIPTION_ID" == "2bb69129-5e74-44d9-af68-96d45633f667" ]]
          [[ "$ACA_RESOURCE_GROUP" == "rg_terian_services_prod" ]]

      # ── Azure login (OIDC — no stored credentials) ──────────────────────────
      - name: Azure Login
        uses: azure/login@v2
        with:
          tenant-id:       ${{ github.ref_name == 'terianix-platform' && vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ github.ref_name == 'terianix-platform' && vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          client-id:       ${{ github.ref_name == 'terianix-platform' && vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}

      # ── Upload all prompt files to Blob Storage ──────────────────────────────
      # upload-batch syncs ai_prompts/ → ai-prompts container.
      # Blob paths become  <skill>/prompt.md  (e.g. base/prompt.md).
      # --overwrite true replaces existing blobs; new blobs are created as-is.
      - name: Upload prompts to Blob Storage
        run: |
          az storage blob upload-batch \
            --account-name ${{ env.STORAGE_ACCOUNT }} \
            --auth-mode    login \
            --destination  ${{ env.BLOB_CONTAINER }} \
            --source       ai_prompts \
            --overwrite    true

      # ── Rolling restart — new revision picks up fresh prompts from Blob ──────
      # Creating a new revision (via --revision-suffix) causes ACA to spin up
      # replicas with the new suffix, then drain the old ones gracefully.
      # New replicas always load prompts from Blob at startup, so they get the
      # just-uploaded content. This works for 1 or N replicas with no extra
      # coordination.
      - name: Restart Container App (rolling)
        if: github.ref_name != 'terianix-platform'
        run: |
          SUFFIX="prompts-$(date +%s)"
          az containerapp update \
            --name           ${{ env.ACA_NAME }} \
            --resource-group ${{ env.ACA_RESOURCE_GROUP }} \
            --revision-suffix "${SUFFIX}"
          echo "New revision suffix: ${SUFFIX}"

      - name: Restart active target revision to reload prompts
        if: github.ref_name == 'terianix-platform'
        run: |
          set -euo pipefail
          revisions="$(az containerapp revision list --name "$ACA_NAME" \
            --resource-group "$ACA_RESOURCE_GROUP" --query '[?properties.active].name' -o tsv)"
          while IFS= read -r revision; do
            if [[ -n "$revision" ]]; then
              az containerapp revision restart --name "$ACA_NAME" \
                --resource-group "$ACA_RESOURCE_GROUP" --revision "$revision"
            fi
          done <<< "$revisions"
