<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="860" height="560" rx="16" fill="#0f0d18"/>

  <!-- title block -->
  <text x="40" y="46" fill="#2dd4bf" font-size="12" font-weight="700" letter-spacing="3">DATA &amp; MODEL ISOLATION</text>
  <text x="40" y="78" fill="#f1f5f9" font-size="20" font-weight="700">Each tenant trains and serves only its own model</text>

  <!-- ===================== TENANT 1 (teal) ===================== -->
  <text x="40" y="124" fill="#5eead4" font-size="12" font-weight="700" letter-spacing="2">TENANT 1</text>

  <!-- nodes -->
  <rect x="40"  y="138" width="150" height="66" rx="10" fill="#0e2926" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="115" y="167" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Tenant 1 data</text>
  <text x="115" y="186" text-anchor="middle" fill="#94a3b8" font-size="11">nominations</text>

  <rect x="233" y="138" width="150" height="66" rx="10" fill="#0e2926" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="308" y="176" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Training job</text>

  <rect x="426" y="138" width="150" height="66" rx="10" fill="#0e2926" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="501" y="166" text-anchor="middle" fill="#5eead4" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">model_tenant_1.pkl</text>
  <text x="501" y="185" text-anchor="middle" fill="#94a3b8" font-size="10.5">ml-models blob</text>

  <rect x="619" y="138" width="150" height="66" rx="10" fill="#0e2926" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="694" y="167" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Fraud scoring</text>
  <text x="694" y="186" text-anchor="middle" fill="#94a3b8" font-size="11">inference</text>

  <!-- arrows -->
  <line x1="190" y1="171" x2="231" y2="171" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="383" y1="171" x2="424" y2="171" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="576" y1="171" x2="617" y2="171" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===================== BARRIER ===================== -->
  <line x1="30" y1="262" x2="830" y2="262" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="262" y="244" width="336" height="36" rx="18" fill="#0f0d18" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="430" y="267" text-anchor="middle" fill="#5eead4" font-size="12.5" font-weight="600">no cross-tenant data or model sharing</text>

  <!-- ===================== TENANT 2 (indigo) ===================== -->
  <text x="40" y="312" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing="2">TENANT 2</text>

  <rect x="40"  y="326" width="150" height="66" rx="10" fill="#171633" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="115" y="355" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Tenant 2 data</text>
  <text x="115" y="374" text-anchor="middle" fill="#94a3b8" font-size="11">nominations</text>

  <rect x="233" y="326" width="150" height="66" rx="10" fill="#171633" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="308" y="364" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Training job</text>

  <rect x="426" y="326" width="150" height="66" rx="10" fill="#171633" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="501" y="354" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">model_tenant_2.pkl</text>
  <text x="501" y="373" text-anchor="middle" fill="#94a3b8" font-size="10.5">ml-models blob</text>

  <rect x="619" y="326" width="150" height="66" rx="10" fill="#171633" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="694" y="355" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Fraud scoring</text>
  <text x="694" y="374" text-anchor="middle" fill="#94a3b8" font-size="11">inference</text>

  <line x1="190" y1="359" x2="231" y2="359" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="383" y1="359" x2="424" y2="359" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="576" y1="359" x2="617" y2="359" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===================== FOOTER ===================== -->
  <rect x="30" y="452" width="800" height="58" rx="12" fill="#0a0916" stroke="#1e293b" stroke-width="1"/>
  <text x="430" y="479" text-anchor="middle" fill="#cbd5e1" font-size="12.5" font-weight="600">Enforced by Microsoft Entra ID &#183; RBAC &#183; per-tenant blob isolation</text>
  <text x="430" y="498" text-anchor="middle" fill="#64748b" font-size="11">Each tenant&#39;s prompts, embeddings, and inputs stay within that tenant&#39;s boundary</text>
</svg>
